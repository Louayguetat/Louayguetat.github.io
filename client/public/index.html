<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080b12" media="(prefers-color-scheme: dark)" />

    <title>Louay Guetat — Full Stack Engineer</title>
    <meta
      name="description"
      content="Louay Guetat is a Full Stack Engineer with 2+ years shipping production web, mobile, and cloud software for a US fintech startup. React, TypeScript, Python, FastAPI, AWS. Open to relocation worldwide across Europe, the Americas, and Asia."
    />
    <meta name="author" content="Louay Guetat" />
    <meta
      name="keywords"
      content="Louay Guetat, Full Stack Engineer, React, TypeScript, Python, FastAPI, AWS, Fintech, Tunis, Portfolio"
    />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Louay Guetat — Full Stack Engineer" />
    <meta
      property="og:description"
      content="Full Stack Engineer building web, mobile, and cloud products for startups. React, TypeScript, Python, FastAPI, AWS."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Louay Guetat — Full Stack Engineer" />
    <meta
      name="twitter:description"
      content="Full Stack Engineer building web, mobile, and cloud products for startups."
    />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231f4ed9'/><text x='50' y='69' font-family='Helvetica,Arial,sans-serif' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>LG</text></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Resolve the theme before first paint so the page never flashes -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute(
            'data-theme',
            saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'light'
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to view this portfolio.</noscript>
    <div id="root"></div>
  </body>
</html>
